<!DOCTYPE html>
<html lang="id" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BISNIS HOTEL</title>
<style>
:root{color-scheme:dark;--bg:#0f0d1a;--s1:#181527;--s2:#221e36;--s3:#2c2746;--ln:#2e2947;--tx:#f1eefb;--mu:#9d97b8;--ac:#ff9a3c;--on:#2a1500;--act:#ffb36b;--ok:#3ddc97;--bad:#ff6b81;--lil:#b9a7ff;--paper:#1e1a31;--sh:0 14px 34px -14px #000b}
[data-theme=light]{color-scheme:light;--bg:#f4f2fa;--s1:#fff;--s2:#efecf8;--s3:#e4e0f3;--ln:#e0dcf0;--tx:#1d1930;--mu:#6c6788;--act:#b85a00;--ok:#0b8a58;--bad:#d9304c;--lil:#6b4ee0;--paper:#fff;--sh:0 14px 34px -16px #3b2f7a55}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;font-variant-numeric:tabular-nums}
h1,h3,.logo b{font-family:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif}
aside{width:248px;background:var(--s1);border-right:1px solid var(--ln);padding:20px 14px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo img{width:66px;height:66px;flex:none;margin:-6px 0}
.logo b{display:block;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.logo small{display:block;font-size:12.5px;color:var(--mu)}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;color:var(--mu);box-sizing:border-box;transition:background .15s,color .15s}
nav button svg,.ib svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:var(--s2);color:var(--tx)}
nav button.on{background:var(--ac);color:var(--on);font-weight:600}
nav b{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
nav button.on b{background:var(--on);color:var(--ac)}
.who{border-top:1px solid var(--ln);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:0 4px}
.me>div{min-width:0}.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mu)}
.av{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;color:var(--act);flex:none;font-style:normal}
.tools{display:flex;gap:6px}
.ib{all:unset;cursor:pointer;flex:1;display:grid;place-items:center;height:36px;border-radius:10px;background:var(--s2);color:var(--mu);box-sizing:border-box}
.ib:hover{color:var(--tx);background:var(--s3)}
main{flex:1;padding:28px 32px;min-width:0}
h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-bottom:18px}
h3{font-size:17px;font-weight:600;margin-bottom:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 370px;gap:20px;align-items:start}
.grid.a{grid-template-columns:340px 1fr}.grid.b{grid-template-columns:1fr 320px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-top:14px}
.p{all:unset;cursor:pointer;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px;transition:transform .12s,border-color .12s,background .12s;box-sizing:border-box}
.p:hover{border-color:var(--ac);background:var(--s2)}.p:active{transform:scale(.97)}
.p .pi{width:38px;height:38px;border-radius:11px;background:hsl(var(--h) 45% 24%);color:hsl(var(--h) 85% 78%);display:grid;place-items:center;font-weight:700;font-size:17px;margin-bottom:4px;font-style:normal}
[data-theme=light] .p .pi{background:hsl(var(--h) 80% 91%);color:hsl(var(--h) 60% 32%)}
.p .nm{font-weight:600;line-height:1.25}.p b{color:var(--act);font-size:16px}
.p span{color:var(--mu);font-size:12.5px}.p.low span{color:var(--bad)}.p.x{opacity:.4;pointer-events:none}
input,select{background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:10px 13px;font:inherit;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
label{display:block;color:var(--mu);font-size:13px;margin-bottom:12px}label input,label select{margin-top:5px}
label.chk{display:flex;align-items:center;gap:9px;color:var(--tx);font-size:14px}label.chk input{width:auto;margin:0;accent-color:var(--ac)}
input[type=checkbox]{accent-color:var(--ac)}
button.pr,button.gh,button.sm{border:0;border-radius:999px;padding:11px 20px;font:inherit;cursor:pointer;font-weight:600;transition:filter .12s,transform .1s,background .12s}
.pr{background:var(--ac);color:var(--on)}.pr:hover{filter:brightness(1.08)}
.gh{background:var(--s2);color:var(--tx)}.gh:hover{background:var(--s3)}
.gh.bad{color:var(--bad)}
.sm{padding:6px 14px!important;background:var(--s2);color:var(--tx);font-weight:500!important}.sm:hover{background:var(--s3)}
.sm.on{background:var(--ac);color:var(--on)}
.pr:active,.gh:active,.sm:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.row{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:500;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
tr:last-child td{border-bottom:0}td.r,th.r{text-align:right}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}.ac{color:var(--act)}.sub{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--s3);color:var(--mu);font-weight:500;vertical-align:middle}
.tag.emp{background:color-mix(in srgb,var(--lil) 20%,transparent);color:var(--lil)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.stat span{color:var(--mu);font-size:13px}.stat div{font-size:22px;font-weight:650;margin-top:4px;letter-spacing:-.01em}
.cart{position:sticky;top:20px;background:var(--paper);border:1px solid var(--ln);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 18px 20px;margin-bottom:12px}
.cart::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-12px;height:12px;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -6px 0/12px 12px}
.ci{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--ln)}
.ci>div:first-child{flex:1;min-width:0}.ci small{color:var(--mu)}
.q{display:flex;align-items:center;gap:6px}.q button{all:unset;cursor:pointer;width:26px;height:26px;text-align:center;background:var(--s2);border-radius:8px}.q button:hover{background:var(--s3)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin:14px 0 12px;padding-top:12px;border-top:2px dashed var(--ln)}
.tot .ac{font-size:26px;font-weight:700;letter-spacing:-.02em}
.big{font-size:34px;font-weight:700;color:var(--act);margin-bottom:14px;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.top>*{width:auto}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{all:unset;cursor:pointer;padding:7px 15px;border-radius:999px;background:var(--s2);color:var(--tx);border:1px solid var(--ln);font-size:14px;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.chip.fix{cursor:default}.chip button{all:unset;cursor:pointer;color:var(--mu);font-size:16px;line-height:1;padding:0 2px}.chip button:hover{color:var(--bad)}
.lbl{color:var(--mu);font-size:13px;margin-bottom:7px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.wrap{overflow-x:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.hd h3{margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:22px;padding:24px;width:min(460px,92vw);max-height:92vh;overflow:auto;margin:auto;box-shadow:var(--sh)}
dialog[open]{animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
#t{position:fixed;inset:auto auto 24px 50%;transform:translateX(-50%);margin:0;border:0;background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;max-width:90vw;box-shadow:var(--sh);width:max-content;height:auto;overflow:visible}
#auth{display:none}
body.locked{display:block}
body.locked aside,body.locked main{display:none}
body.locked #auth{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(640px 380px at 50% 8%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 70%)}
.login{width:min(400px,100%);padding:26px;box-shadow:var(--sh)}
.login img{display:block;margin:0 auto 6px;width:170px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.login h1{text-align:center;margin-bottom:6px}.login p{text-align:center;margin-bottom:18px;font-size:14px}
:focus-visible{outline:2px solid var(--ac)!important;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;gap:8px}.logo{padding:0 6px 0 0}.logo img{width:40px;height:40px}.logo div{display:none}nav{flex-direction:row;flex:none}nav button{white-space:nowrap}.who{border:0;padding:0;flex-direction:row;align-items:center;margin-left:auto}.me>div{display:none}.tools{flex:none}.ib{width:36px;flex:none}main{padding:18px 16px}.grid,.grid.a,.grid.b{grid-template-columns:1fr}.cart{position:static}}
@media print{aside,.top,.tabs,button,#auth,#t{display:none!important}body{background:#fff;color:#000}.card,.stat{border-color:#ccc;background:#fff}}
</style></head><body class="locked">
<aside><div class="logo"><img src="assets/logo.svg" alt="Kucing menghitung uang"><div><b>BH</b><small>Showcase Cashier</small></div></div><nav id="nav"></nav><div class="who" id="who"></div></aside>
<main id="main"></main><div id="auth"></div><dialog id="m"></dialog><input id="xf" type="file" accept=".xlsx,.csv" hidden><div id="t" popover="manual" role="status"></div>
<script>
const $=s=>document.querySelector(s),m=$('#m');
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pad=id=>'TRX-'+String(id).padStart(4,'0');
const hue=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const DEF_M=['Tunai','Transfer','QRIS','Kartu debit'];
let db={products:[],sales:[],ins:[],users:[],methods:DEF_M.slice()};
try{db=Object.assign(db,JSON.parse(localStorage.getItem('pos_db')||'{}'))}catch(e){}
const migrate=()=>{if(!Array.isArray(db.users))db.users=[];if(!Array.isArray(db.ins))db.ins=[];if(!Array.isArray(db.methods)||!db.methods.length)db.methods=DEF_M.slice();db.sales.forEach(s=>{s.pays=s.pays||[];s.retur=s.retur||[]})};migrate();
const save=()=>{try{localStorage.setItem('pos_db',JSON.stringify(db))}catch(e){toast('Gagal menyimpan data')}};
const toast=s=>{const t=$('#t');t.textContent=s;try{if(!t.matches(':popover-open'))t.showPopover()}catch(e){t.style.display='block'}clearTimeout(toast.h);toast.h=setTimeout(()=>{try{t.hidePopover()}catch(e){t.style.display='none'}},4200)};
let theme=(()=>{try{return localStorage.getItem('pos_theme')}catch(e){}})()||'dark';
const applyTheme=()=>{document.documentElement.dataset.theme=theme};applyTheme();
function toggleTheme(){theme=theme==='dark'?'light':'dark';try{localStorage.setItem('pos_theme',theme)}catch(e){}applyTheme();render()}
const prod=id=>db.products.find(p=>p.id===id);
const sl=id=>db.sales.find(x=>x.id===id);
const rv=s=>(s.retur||[]).reduce((a,r)=>a+r.a,0);
const sisa=s=>s.total-s.paid-rv(s);
const retQ=(s,id)=>(s.retur||[]).reduce((a,r)=>a+r.items.filter(i=>i.id===id).reduce((b,i)=>b+i.q,0),0);
const names=()=>[...new Set(db.sales.map(s=>s.cu).filter(Boolean))];
const empN=n=>!!n&&db.sales.some(s=>s.cu===n&&s.emp);
const modal=h=>{m.innerHTML=h;if(!m.open)m.showModal()};
const mOpts=v=>db.methods.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
/* ICON */
const IC={
 kasir:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
 barang:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
 masuk:'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
 hutang:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
 laporan:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
 atur:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
 key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2m-15.07-7.07 1.41 1.41m11.32 11.32 1.41 1.41m0-14.14-1.41 1.41M6.34 17.66l-1.41 1.41"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
/* AUTH */
let me=null,fails=0,lockUntil=0;
const roleL={admin:'Admin',kasir:'Kasir'};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
async function hashPw(pw,salt){const E=new TextEncoder(),k=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:E.encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
async function mkUser(name,user,pw,role){const salt=rnd();return{id:nid(),name,user:user.toLowerCase(),salt,hash:await hashPw(pw,salt),role}}
const okUser=u=>/^[a-z0-9._-]{3,20}$/i.test(u);
const adm=()=>{if(me&&me.role==='admin')return true;toast('Fitur ini hanya untuk admin');return false};
const setupView=()=>`<form class="login card" onsubmit="doSetup(event)"><img src="assets/logo.svg" alt="Kucing menghitung uang"><h1>Selamat datang</h1><p class="mu">Buat akun admin pertama. Akun kasir bisa ditambahkan nanti di Pengaturan.</p>
<label>Nama lengkap<input id="sn" required autocomplete="off"></label><label>Username<input id="su" required autocomplete="off" placeholder="huruf kecil atau angka, min. 3"></label>
<label>Password<input id="sp" type="password" required placeholder="Minimal 6 karakter"></label><label>Ulangi password<input id="sp2" type="password" required></label><button class="pr" style="width:100%">Buat akun admin</button></form>`;
const loginView=()=>`<form class="login card" onsubmit="doLogin(event)"><img src="assets/logo.svg" alt="Kucing menghitung uang"><h1>Masuk ke kasir</h1><p class="mu">BH Showcase Cashier</p>
<label>Username<input id="lu" required autocomplete="username"></label><label>Password<input id="lp" type="password" required autocomplete="current-password"></label><button class="pr" style="width:100%">Masuk</button></form>`;
async function doSetup(e){e.preventDefault();if(db.users.length)return;const n=$('#sn').value.trim(),u=$('#su').value.trim(),p=$('#sp').value;
  if(!n)return toast('Isi nama lengkap');if(!okUser(u))return toast('Username 3-20 karakter: huruf, angka, titik, strip');
  if(p.length<6)return toast('Password minimal 6 karakter');if(p!==$('#sp2').value)return toast('Ulangi password tidak sama');
  me=await mkUser(n,u,p,'admin');db.users.push(me);save();view='kasir';render()}
async function doLogin(e){e.preventDefault();
  if(Date.now()<lockUntil)return toast('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((lockUntil-Date.now())/1000)+' detik');
  const x=db.users.find(a=>a.user===$('#lu').value.trim().toLowerCase());
  if(!x||await hashPw($('#lp').value,x.salt)!==x.hash){if(++fails>=5){fails=0;lockUntil=Date.now()+3e4}return toast('Username atau password salah')}
  fails=0;me=x;view='kasir';render()}
function logout(){if(m.open)m.close();me=null;cart=[];sel.clear();render()}
/* NAV */
const AD=['admin'],ALL=['admin','kasir'];
const NAV=[['kasir','Kasir',ALL],['barang','Barang',AD],['masuk','Stok masuk',AD],['hutang','Piutang',ALL],['laporan','Laporan',AD],['atur','Pengaturan',AD]];
const can=v=>!!me&&NAV.some(n=>n[0]===v&&n[2].includes(me.role));
let view='kasir',cart=[],q='',rtab='jual',from=ymd(Date.now()).slice(0,8)+'01',to=ymd(Date.now());
function go(v){if(!can(v))return toast('Menu ini hanya untuk admin');view=v;render()}
function render(){
  document.body.classList.toggle('locked',!me);
  if(!me){$('#auth').innerHTML=db.users.length?loginView():setupView();setTimeout(()=>($('#lu')||$('#sn'))&&($('#lu')||$('#sn')).focus(),0);return}
  if(!can(view))view='kasir';
  const n=db.sales.filter(s=>sisa(s)>0).length;
  $('#nav').innerHTML=NAV.filter(x=>x[2].includes(me.role)).map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${svg(k)}${l}${k==='hutang'&&n?`<b>${n}</b>`:''}</button>`).join('');
  $('#who').innerHTML=`<div class="me"><i class="av">${esc([...me.name.trim()][0]||'?').toUpperCase()}</i><div><b>${esc(me.name)}</b><small>${roleL[me.role]}</small></div></div><div class="tools"><button class="ib" title="Ganti password" aria-label="Ganti password" onclick="passForm('${me.id}')">${svg('key')}</button><button class="ib" title="Ganti tema" aria-label="Ganti tema" onclick="toggleTheme()">${svg(theme==='dark'?'sun':'moon')}</button><button class="ib" title="Keluar" aria-label="Keluar" onclick="logout()">${svg('out')}</button></div>`;
  $('#main').innerHTML=({kasir,barang,masuk,hutang,laporan,atur})[view]();
}
/* KASIR */
const total=()=>cart.reduce((a,c)=>a+c.q*prod(c.id).price,0);
function kasir(){
  const list=db.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  return `<h1>Kasir</h1><div class="grid"><div><input placeholder="Cari barang..." value="${esc(q)}" oninput="q=this.value;keepFocus(this)" id="sq">

function rsave(id){
  const s=sl(id),its=[];let a=0;

  <div class="grid b"><div class="card wrap"><h3>Daftar transaksi</h3><table><tr><th>No</th><th>Waktu</th><th>Pelanggan</th><th>Kasir</th><th>Metode</th><th class="r">Total</th><th class="r">Status</th><th></th></tr>
  ${ss.slice().reverse().map(s=>`<tr><td><b>${pad(s.id)}</b></td><td class="mu">${dt(s.t)}</td><td>${s.cu?esc(s.cu)+(empN(s.cu)?' <span class="tag emp">Karyawan</span>':''):'<span class="mu">Umum</span>'}</td><td class="mu">${esc(s.by||'-')}</td><td>${esc(s.method||'Tunai')}</td><td class="r">${rp(s.total)}${rv(s)?`<div class="bad sub">retur ${rp(rv(s))}</div>`:''}</td><td class="r ${sisa(s)>0?'bad':'ok'}">${sisa(s)>0?'Sisa '+rp(sisa(s)):'Lunas'}</td><td class="r"><button class="sm" onclick="toHutang(${s.id})">${sisa(s)>0?'Ubah hutang':'Jadikan hutang'}</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Tidak ada transaksi pada periode ini.</td></tr>'}</table></div>
  <div class="card"><h3>Barang terlaris</h3>${Object.entries(sold).filter(e=>e[1].q>0).sort((a,b)=>b[1].q-a[1].q).slice(0,8).map(([n,o])=>`<div class="ci"><div>${esc(n)}</div><div class="mu">${o.q} terjual</div></div>`).join('')||'<div class="empty">Belum ada data.</div>'}</div></div>`;
  else body=`<div class="stats"><div class="stat"><span>Jumlah jenis barang</span><div>${db.products.length}</div></div><div class="stat"><span>Nilai stok (modal)</span><div class="ac">${rp(nilai)}</div></div></div>
  <div class="card wrap"><table><tr><th>Barang</th><th class="r">Masuk (periode)</th><th class="r">Terjual (periode)</th><th class="r">Stok akhir</th><th class="r">Nilai</th></tr>
  ${db.products.map(p=>{const mi=db.ins.filter(i=>i.id===p.id&&inr(i.t)).reduce((a,i)=>a+i.q,0),so=(sold[p.name]||{q:0}).q;return `<tr><td>${esc(p.name)}</td><td class="r ok">${mi}</td><td class="r">${so}</td><td class="r ${p.stock<=5?'bad':''}"><b>${p.stock}</b></td><td class="r mu">${rp(p.stock*p.cost)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Belum ada barang.</td></tr>'}</table></div>`;
  return `<h1>Laporan</h1><div class="top"><input type="date" value="${from}" onchange="from=this.value;render()" aria-label="Dari tanggal"><input type="date" value="${to}" onchange="to=this.value;render()" aria-label="Sampai tanggal">
  <button class="sm" onclick="csv()">Export Excel</button><button class="sm" onclick="window.print()">Cetak</button><button class="sm" onclick="backup()">Backup data</button><button class="sm" onclick="$('#rf').click()">Restore data</button><input id="rf" type="file" accept=".json" hidden onchange="restore(this)"></div>
  <div class="tabs"><button class="sm ${rtab==='jual'?'on':''}" onclick="rtab='jual';render()">Penjualan</button><button class="sm ${rtab==='stok'?'on':''}" onclick="rtab='stok';render()">Stok akhir</button></div>${body}`;
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csv(){const inr=s=>ymd(s.t)>=from&&ymd(s.t)<=to;const r=rtab==='jual'?[['No','Waktu','Pelanggan','Karyawan','Kasir','Metode','Barang','Qty','Harga','Total Transaksi','Dibayar','Retur Barang','Sisa']].concat(db.sales.filter(inr).flatMap(s=>s.items.map((i,k)=>[pad(s.id),dt(s.t),s.cu,empN(s.cu)?'Ya':'',s.by||'',s.method||'Tunai',i.n,i.q,i.p,k?'':s.total,k?'':s.paid,k?'':rv(s),k?'':sisa(s)]))):[['Barang','Stok akhir','Harga modal','Nilai']].concat(db.products.map(p=>[p.name,p.stock,p.cost,p.stock*p.cost]));xlsx('laporan-'+rtab+'-'+ymd(Date.now()),r,'Laporan')}
function backup(){if(!adm())return;dl('backup-kasir-'+ymd(Date.now())+'.json',JSON.stringify(db),'application/json')}
function restore(el){if(!adm())return;const f=el.files[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;if(!confirm('Data sekarang akan diganti dengan backup. Jika backup berisi akun pengguna, akun juga ikut diganti. Lanjut?'))return;
  const keep=db.users;db=Object.assign({products:[],sales:[],ins:[],users:[],methods:DEF_M.slice()},d);if(!db.users.length)db.users=keep;migrate();save();me=db.users.find(u=>u.id===me.id)||null;toast('Data berhasil dipulihkan');render()}catch(e){toast('File backup tidak valid')}};r.readAsText(f)}
/* PENGATURAN */
function atur(){
  return `<h1>Pengaturan</h1><div class="card wrap" style="margin-bottom:16px"><div class="hd"><h3>Pengguna</h3><button class="pr" onclick="uform()">Tambah pengguna</button></div>
  <table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}${u.id===me.id?' <span class="tag">Anda</span>':''}</td><td class="mu">${esc(u.user)}</td><td>${roleL[u.role]}</td><td class="r"><div class="acts"><button class="sm" onclick="passForm('${u.id}')">Ganti password</button>${u.id===me.id?'':`<button class="sm" onclick="udel('${u.id}')">Hapus</button>`}</div></td></tr>`).join('')}</table></div>
  <div class="card"><h3>Metode pembayaran</h3><div class="chips">${db.methods.map((x,i)=>i===0?`<span class="chip fix">${esc(x)}</span>`:`<span class="chip fix">${esc(x)}<button aria-label="Hapus ${esc(x)}" onclick="mdel(${i})">×</button></span>`).join('')}</div>
  <div class="top"><input id="mn" placeholder="Metode baru, misalnya GoPay" maxlength="20" style="max-width:280px" onkeydown="if(event.key==='Enter')madd()"><button class="pr" onclick="madd()">Tambah metode</button></div><p class="mu sub">Tunai selalu ada dan dipakai untuk hitung kembalian. Metode yang dihapus tidak mengubah riwayat transaksi lama.</p></div>`;
}
function madd(){if(!adm())return;const v=$('#mn').value.trim();if(!v)return toast('Isi nama metode');if(db.methods.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Metode sudah ada');db.methods.push(v);save();render()}
function mdel(i){if(!adm()||i<1)return;if(!confirm('Hapus metode '+db.methods[i]+'?'))return;db.methods.splice(i,1);save();render()}
function uform(){modal(`<h3>Tambah pengguna</h3><label>Nama lengkap<input id="un" autocomplete="off"></label><label>Username<input id="uu" autocomplete="off"></label>
  <label>Peran<select id="ur"><option value="kasir">Kasir (hanya Kasir dan Piutang)</option><option value="admin">Admin (semua menu)</option></select></label>
  <label>Password<input id="up" type="password" placeholder="Minimal 6 karakter"></label><div class="row"><button class="gh" onclick="m.close()">Batal</button><button class="pr" onclick="usave()">Simpan pengguna</button></div>`)}
async function usave(){if(!adm())return;const n=$('#un').value.trim(),u=$('#uu').value.trim().toLowerCase(),p=$('#up').value;
  if(!n)return toast('Isi nama lengkap');if(!okUser(u))return toast('Username 3-20 karakter: huruf, angka, titik, strip');if(db.users.some(x=>x.user===u))return toast('Username sudah dipakai');if(p.length<6)return toast('Password minimal 6 karakter');
  db.users.push(await mkUser(n,u,p,$('#ur').value));save();m.close();toast('Pengguna '+n+' ditambahkan');render()}
function udel(id){if(!adm()||id===me.id)return;const u=db.users.find(x=>x.id===id);if(!u)return;if(u.role==='admin'&&db.users.filter(x=>x.role==='admin').length<2)return toast('Harus ada minimal satu admin');if(!confirm('Hapus pengguna '+u.name+'?'))return;db.users=db.users.filter(x=>x.id!==id);save();render()}
function passForm(id){const self=id===me.id,u=db.users.find(x=>x.id===id);if(!u||(!self&&me.role!=='admin'))return;
  modal(`<h3>${self?'Ganti password saya':'Ganti password '+esc(u.name)}</h3>${self?'<label>Password lama<input id="po" type="password"></label>':''}<label>Password baru<input id="pn" type="password" placeholder="Minimal 6 karakter"></label><label>Ulangi password baru<input id="pn2" type="password"></label>
  <div class="row"><button class="gh" onclick="m.close()">Batal</button><button class="pr" onclick="passSave('${id}')">Simpan password</button></div>`)}
async function passSave(id){const self=id===me.id,u=db.users.find(x=>x.id===id);if(!u||(!self&&me.role!=='admin'))return;
  if(self&&await hashPw($('#po').value,u.salt)!==u.hash)return toast('Password lama salah');
  const p=$('#pn').value;if(p.length<6)return toast('Password minimal 6 karakter');if(p!==$('#pn2').value)return toast('Ulangi password tidak sama');
  u.salt=rnd();u.hash=await hashPw(p,u.salt);save();m.close();toast('Password diperbarui')}
/* EXCEL */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=-1;for(const x of b)c=crcT[(c^x)&255]^(c>>>8);return(c^-1)>>>0};
const U=new TextEncoder(),colL=i=>String.fromCharCode(65+i);
function zip(files){
  const loc=[],cen=[];let off=0;
  for(const[n,s]of files){const nb=U.encode(n),d=U.encode(s),c=crc(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
    const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(14,0x21,true);g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,off,true);
    loc.push(h.buffer,nb,d);cen.push(g.buffer,nb);off+=30+nb.length+d.length}
  const cs=cen.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...loc,...cen,e.buffer]);
}
function xlsx(name,rows,sheet){
  const x=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
  const sd=rows.map((r,i)=>`<row r="${i+1}">`+r.map((v,j)=>typeof v==='number'?`<c r="${colL(j)}${i+1}"><v>${v}</v></c>`:`<c r="${colL(j)}${i+1}" t="inlineStr"><is><t>${x(v)}</t></is></c>`).join('')+'</row>').join('');
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',R='http://schemas.openxmlformats.org/package/2006/relationships',O='http://schemas.openxmlformats.org/officeDocument/2006/relationships',S='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const f=[['[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
  ['_rels/.rels',H+`<Relationships xmlns="${R}"><Relationship Id="rId1" Type="${O}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
  ['xl/workbook.xml',H+`<workbook xmlns="${S}" xmlns:r="${O}"><sheets><sheet name="${sheet}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
  ['xl/_rels/workbook.xml.rels',H+`<Relationships xmlns="${R}"><Relationship Id="rId1" Type="${O}/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`],
  ['xl/worksheets/sheet1.xml',H+`<worksheet xmlns="${S}"><cols><col min="1" max="14" width="22" customWidth="1"/></cols><sheetData>${sd}</sheetData></worksheet>`]];
  const a=document.createElement('a');a.href=URL.createObjectURL(zip(f));a.download=name+'.xlsx';a.click();
}
async function inflate(b){return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
async function readXlsx(buf){
  const v=new DataView(buf),u=new Uint8Array(buf);let e=buf.byteLength-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const F={};
  for(let i=0;i<n;i++){const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(name==='xl/worksheets/sheet1.xml'||name==='xl/sharedStrings.xml'){const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=u.subarray(ds,ds+cs);if(meth===8)d=await inflate(d);F[name]=new TextDecoder().decode(d)}}
  const P=s=>new DOMParser().parseFromString(s,'application/xml');
  const ss=F['xl/sharedStrings.xml']?[...P(F['xl/sharedStrings.xml']).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const rows=[];
  for(const r of P(F['xl/worksheets/sheet1.xml']).getElementsByTagName('row')){const row=[];
    for(const c of r.getElementsByTagName('c')){const ci=[...c.getAttribute('r').replace(/\d/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t'),vv=c.getElementsByTagName('v')[0];
      let val=t==='inlineStr'?[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''):vv?vv.textContent:'';if(t==='s')val=ss[+val];row[ci]=val}
    rows.push(Array.from(row,x=>x??''))}
  return rows;
}
function readCsv(t){t=t.replace(/^\ufeff/,'');const l=t.split('\n')[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',',rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows}
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));return isNaN(n)?0:n};
let xk='';
function imp(k){xk=k;$('#xf').value='';$('#xf').click()}
$('#xf').onchange=async e=>{const f=e.target.files[0];if(!f)return;let rows;
  try{rows=/\.csv$/i.test(f.name)?readCsv(await f.text()):await readXlsx(await f.arrayBuffer())}catch(err){return toast('File tidak bisa dibaca. Gunakan .xlsx atau .csv')}
  rows=rows.slice(1).filter(r=>r.some(x=>String(x).trim()));xk==='barang'?impBarang(rows):impMasuk(rows)};
function impBarang(rows){let a=0,u=0;rows.forEach(r=>{const n=String(r[0]).trim();if(!n)return;const p=db.products.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(p){p.price=num(r[1]);p.cost=num(r[2]);u++}else{db.products.push({id:nid(),name:n,price:num(r[1]),cost:num(r[2]),stock:num(r[3])});a++}});
  save();toast(a+' barang baru, '+u+' barang diperbarui (harga). Stok hanya dipakai untuk barang baru.');render()}
function impMasuk(rows){let ok=0;const miss=new Set();rows.forEach(r=>{const nm=String(r[1]).trim(),p=db.products.find(x=>x.name.toLowerCase()===nm.toLowerCase()),qn=num(r[2]);
  if(!p||!(qn>0)){miss.add(nm);return}let t=Date.now();if(r[0]!==''){const n=+r[0],x=n>20000?(n-25569)*864e5:Date.parse(r[0]);if(!isNaN(x))t=x}
  p.stock+=qn;const c=num(r[3]);if(c>0)p.cost=c;db.ins.push({t,id:p.id,n:p.name,q:qn});ok++});
  save();render();toast(ok+' baris stok masuk'+(miss.size?'. Dilewati (barang belum terdaftar): '+[...miss].slice(0,3).join(', '):''))}
const xbarang=()=>xlsx('data-barang',[['Nama','Harga Jual','Harga Modal','Stok']].concat(db.products.map(p=>[p.name,p.price,p.cost,p.stock])),'Barang');
const xmasuk=()=>xlsx('penerimaan-barang',[['Tanggal','Nama Barang','Jumlah','Harga Modal']].concat(db.ins.map(i=>[ymd(i.t),i.n,i.q,prod(i.id)?prod(i.id).cost:0])),'Stok Masuk');
const tpl=k=>k==='barang'?xlsx('template-barang',[['Nama','Harga Jual','Harga Modal','Stok'],['Contoh Barang',5000,3500,20]],'Barang'):xlsx('template-stok-masuk',[['Tanggal','Nama Barang','Jumlah','Harga Modal'],[ymd(Date.now()),'Contoh Barang',10,3500]],'Stok Masuk');
render();
</script></body></html>
